<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Rose Quartz Bracelet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF3F4"/>
      <stop offset="100%" stop-color="#F0D9DE"/>
    </linearGradient>
    <radialGradient id="bead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F3C4CB"/>
      <stop offset="55%" stop-color="#C97886"/>
      <stop offset="100%" stop-color="#9E4F5D"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- soft bracelet loop -->
  <g fill="url(#bead)">
    <circle cx="400" cy="210" r="28"/><circle cx="470" cy="230" r="28"/><circle cx="525" cy="275" r="28"/>
    <circle cx="560" cy="340" r="28"/><circle cx="570" cy="410" r="28"/><circle cx="545" cy="475" r="28"/>
    <circle cx="490" cy="520" r="28"/><circle cx="420" cy="540" r="28"/><circle cx="350" cy="530" r="28"/>
    <circle cx="290" cy="485" r="28"/><circle cx="250" cy="420" r="28"/><circle cx="245" cy="345" r="28"/>
    <circle cx="275" cy="280" r="28"/><circle cx="330" cy="235" r="28"/>
  </g>
  <text x="400" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#4A0B1D">Rose Quartz</text>
</svg>
